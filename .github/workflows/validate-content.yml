name: Validate practical field reference
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all local labs and content
        run: python scripts/validate.py
      - name: JavaScript syntax
        run: node --check app.js
