name: Validate AIHACKBins
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalogue, fixtures, labs and research audit
        run: |
          python scripts/validate.py
          python scripts/validate_release.py
          python scripts/validate_mapping_policy.py
          python scripts/test_payload_integrity.py
      - run: python scripts/validate_assessment.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check lab.js
          node --check lab-outcomes.js
      - name: Browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser regression checks
        run: python scripts/browser_smoke.py
